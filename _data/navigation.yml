#   url   - where the link goes (a full https:// address opens in a new tab)
#   match - other pages that should highlight this link: page paths, or
#           collection names (every post in that collection counts)

main:

  - title: "Writing"
    icon: pen
    url: /writing/
    match: [/aiengineering/, /greensoftware/, /notes/, aiengineering, greensoftware, notes]

  - title: "Three Voices"
